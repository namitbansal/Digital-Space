<section class="auth-screen">
  <div class="auth-card">
    <app-guidance-panel guidanceId="unlock" />
    <h1 class="auth-brand">{{ appName }}</h1>
    <p class="auth-sub">Unlock your vault</p>
    <form (ngSubmit)="submit()">
      <div class="field">
        <label for="unlock-username">Username <span class="field-label__required" aria-hidden="true">*</span></label>
        <input
          id="unlock-username"
          name="username"
          type="text"
          required
          [(ngModel)]="username"
          autocomplete="username"
          placeholder="your_username"
          spellcheck="false"
          autocapitalize="off"
          autofocus
        />
      </div>
      <div class="field">
        <label for="mp">Master password <span class="field-label__required" aria-hidden="true">*</span></label>
        <input id="mp" name="password" type="password" required [(ngModel)]="password" autocomplete="current-password" />
      </div>
      @if (oauthResumeHint) {
        <p class="auth-sub">{{ oauthResumeHint }}</p>
      }
      @if (error) {
        <p class="auth-error">{{ error }}</p>
      }
      <div class="auth-actions auth-actions--stack">
        <button class="btn btn--primary btn--wide" type="submit" [disabled]="busy">Unlock</button>
        <div class="auth-actions__links">
          <button type="button" class="auth-link" (click)="forgot.emit()" [disabled]="busy">Forgot master password?</button>
        </div>
        <button class="btn btn--ghost btn--wide" type="button" (click)="back.emit()">Back</button>
      </div>
    </form>
  </div>
</section>
