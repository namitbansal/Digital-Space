<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Personal Vault">
  <defs>
    <linearGradient id="bg" x1="24" y1="10" x2="104" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="door" x1="40" y1="32" x2="88" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rim" x1="36" y1="28" x2="92" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <!-- App tile -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Vault body -->
  <rect x="30" y="34" width="68" height="62" rx="10" fill="url(#door)" stroke="url(#rim)" stroke-width="3"/>
  <!-- Vault door seam -->
  <path d="M64 40v50" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <!-- Lock dial -->
  <circle cx="64" cy="64" r="16" fill="#0f172a" stroke="url(#rim)" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="5" fill="#cbd5e1"/>
  <path d="M64 52v6" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Handle -->
  <rect x="78" y="60" width="10" height="8" rx="2" fill="url(#rim)"/>
</svg>
